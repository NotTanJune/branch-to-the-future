[package]
name = "branch-to-the-future"
version = "0.1.0"
edition = "2021"

[lib]
name = "branch_futures"
path = "src/lib.rs"

[[bin]]
name = "brf"
path = "src/main.rs"

[features]
default = ["fx"]
fx = ["dep:tachyonfx"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ignore = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = { version = "0.25", optional = true }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
