[project]
name = "brf-agent"
version = "0.1.0"
description = "Agent-friendly Python sidecar for Branch to the Future"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
agents = ["openai-agents>=0.5.0"]
mcp = ["mcp>=1.16.0"]
all = ["brf-agent[agents,mcp]"]

[project.scripts]
brf-agent = "brf_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "brf-agent[all]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/brf_agent"]
